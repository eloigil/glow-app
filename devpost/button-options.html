<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowApp Button Options</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
  :root { --canvas: #F6F3F5; --surface: #FDFCFD; --ink: #17141A; --muted: #5D5662; --rose: #EC94B0; --wash: #FBE8EE; --line: #EDE4EA; --peach: #FCE3DA; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.55 "Geist", system-ui, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font: 700 clamp(28px, 5vw, 40px)/1.1 "Unbounded", sans-serif; letter-spacing: -.03em; margin: 0 0 10px; }
  .sub { color: var(--muted); max-width: 60ch; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .opt { background: var(--surface); border-radius: 10px; padding: 18px; }
  .opt h2 { font: 600 16px "Geist", sans-serif; margin: 0 0 4px; }
  .opt p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .card { border-radius: 10px; padding: 8px; background: var(--surface); box-shadow: 0 10px 30px rgb(120 50 80 / .10); border: 1px solid var(--line); }
  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .face { aspect-ratio: 3/4; border-radius: 8px; background: radial-gradient(42% 34% at 50% 42%, #FFF1F4, transparent 72%), radial-gradient(80% 70% at 50% 45%, #F9DCE5, #F3CAD7 85%); }
  .top h3 { margin: 4px 0 6px; font: 700 14px/1.2 "Unbounded", sans-serif; letter-spacing: -.02em; }
  .top small { color: var(--muted); font-size: 12px; line-height: 1.45; display: block; }
  .products { display: flex; gap: 8px; margin: 12px 0 10px; }
  .products span { width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--rose); }
  iconify-icon { font-size: 26px; display: inline-flex; }
  .b { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; padding: 13px; font: 500 14px "Geist", sans-serif; cursor: pointer; transition: transform .2s cubic-bezier(.16,1,.3,1); }
  .b:active { transform: scale(.98) translateY(1px); }
  .b iconify-icon { font-size: 20px; }
  .v1 { border-radius: 999px; background: var(--ink); color: #FDFCFD; }
  .v2 { border-radius: 999px; background: var(--rose); color: var(--ink); box-shadow: 0 8px 20px rgb(236 148 176 / .45); }
  .v3 { border-radius: 8px; background: var(--rose); color: var(--ink); }
  .v4 { border-radius: 999px; background: linear-gradient(100deg, #F6C1D2, #FCE3DA); color: var(--ink); box-shadow: inset 0 1px 0 rgb(255 255 255 / .8), 0 8px 20px rgb(236 148 176 / .35); }
  .v5 { border-radius: 999px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--rose); }
  .v6 { border-radius: 999px; color: var(--ink); background: rgb(246 193 210 / .45); border: 1px solid rgb(255 255 255 / .8);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .9), 0 8px 24px rgb(236 148 176 / .35); backdrop-filter: blur(16px); }
</style>
</head>
<body>
<main>
  <h1>Start makeup, six ways</h1>
  <p class="sub">The same grown look card with a different primary button. Whichever you pick becomes the primary button everywhere (Start, Next step, Finish).</p>
  <div class="grid" id="g"></div>
</main>
<script>
  const v = [
    ["v1", "1. Current: ink pill", "Strong, but heavy and dark against the soft card."],
    ["v2", "2. Pastel rose pill", "Your accent as the fill, dark text, soft rose glow."],
    ["v3", "3. Pastel rose, squared", "Same fill, 8px corners to match the tighter cards."],
    ["v4", "4. Blush to peach gradient", "Echoes the welcome photo. Most \"glow\"."],
    ["v5", "5. Outline", "White with a pastel rose border. Quietest."],
    ["v6", "6. Rose glass", "Tinted glass with a highlight edge, like the wizard."]
  ];
  document.getElementById("g").innerHTML = v.map(([c, t, d]) => `
    <div class="opt"><h2>${t}</h2><p>${d}</p>
      <div class="card">
        <div class="top"><div class="face"></div><div><h3>Fresh berry</h3><small>Sheer base, spot-concealed chin, soft berry lip. About 10 minutes.</small></div></div>
        <div class="products"><span><iconify-icon icon="hugeicons:dropper"></iconify-icon></span><span><iconify-icon icon="hugeicons:sparkles"></iconify-icon></span><span><iconify-icon icon="hugeicons:favourite"></iconify-icon></span></div>
        <button class="b ${c}">Start makeup <iconify-icon icon="hugeicons:blush-brush-01"></iconify-icon></button>
      </div></div>`).join("");
</script>
</body>
</html>
